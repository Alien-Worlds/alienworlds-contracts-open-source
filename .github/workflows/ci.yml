name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build contracts and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node v5 and later enable dependency caching by default whenever
          # package.json has a packageManager field, which this one does. Turning
          # the cache on is a reasonable thing to want, but it should be its own
          # change with its own green run behind it, not something inherited as a
          # side effect of a version bump - yarn v1 has a cache race that produced
          # exactly the install failures --network-concurrency 1 below works
          # around, and that is not a debugging session to re-enter by accident.
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive --network-concurrency 1

      # Fails in seconds if the toolchain cannot even load, rather than as a
      # confusing error inside the first test.
      - name: Verify the test runner loads
        run: yarn lamington --version

      # Two settings in .lamingtonrc are right for a developer at a terminal and
      # wrong for CI, and lamington has no flag to override either from the
      # command line (Alien-Worlds/lamington#38), so they are patched in place.
      #
      # bailOnFailure stops the suite at the first failure. Locally that saves a
      # wait you were about to interrupt anyway. In CI the runner is already paid
      # for, and stopping early means a red build reports a handful of passes out
      # of the whole suite and tells you nothing about whether the rest still
      # pass - which is the first question anyone asks of a red build.
      #
      # The List reporter announces each test and then reports it, so it costs two
      # lines per test and about two thirds of the log. Spec carries the same
      # names and durations on one line each, nested under their describes.
      - name: Report every failure, not just the first
        run: |
          jq '.bailOnFailure = false | .reporter = "Spec"' .lamingtonrc > .lamingtonrc.ci
          mv .lamingtonrc.ci .lamingtonrc
          git diff --stat .lamingtonrc

      # No cache of artifacts/compiled_contracts here, though it looks like the
      # obvious win: this repository compiles twenty-seven contracts and most pull
      # requests touch no C++ at all. It was tried in eosdac-contracts, on run
      # 34594298990, and it does nothing. The cache restores correctly - the log
      # reads "Cache restored successfully" - and lamington then recompiles every
      # contract regardless, because of how it decides one is unchanged
      # (contractCompiling.ts):
      #
      #     prevModTime.getUTCMilliseconds() != this.modDate.getMilliseconds()
      #
      # That compares the milliseconds component of the two timestamps, 0 to 999,
      # rather than the timestamps (Alien-Worlds/lamington#33). A fresh checkout
      # stamps every source file with the checkout time, so the component is
      # effectively random and a restored artifact is called stale almost every
      # time. Worth revisiting once #33 is fixed, at which point it is free.
      - name: Build contracts and run the full suite
        run: yarn test

      # Guards Alien-Worlds/lamington#69, which made this repository unbuildable on
      # Linux: eosio-cpp ran as root in the container, so the output directories
      # and the artifacts came back root-owned and lamington could not write its
      # .mod.json build stamp. Fixed in lamington v1.5.2, which is why the
      # pre-create workaround that used to sit above the build is gone.
      #
      # Kept as a standing assertion rather than deleted along with the
      # workaround: the failure is invisible on macOS, because Docker Desktop
      # maps ownership through its VM, so CI is the only place a regression
      # would ever show.
      - name: Assert the build artifacts belong to the build user
        # Runs even when the suite is red. This asserts a property of the build,
        # not of the tests, and a flaky test should not cost us the evidence.
        if: always()
        run: |
          strays=$(find artifacts/compiled_contracts -not -user "$(id -u)" -printf '%u %p\n' 2>/dev/null)
          if [ -n "$strays" ]; then
            echo "build artifacts are not owned by $(id -u), the user that ran the build:" >&2
            echo "$strays" | head -20 >&2
            echo "this is the lamington#69 regression; see the note above this step." >&2
            exit 1
          fi
          echo "all build artifacts owned by $(id -u)"

      - name: Upload the chain and test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: .lamington/
          retention-days: 7
          if-no-files-found: ignore
